---
- name: Update all packages and reboot server
  hosts: ubuntu_vm
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      register: apt_update
      when: ansible_facts['os_family'] == "Debian"

    - name: Upgrade all packages to the latest versions
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: apt_upgrade
      when: ansible_facts['os_family'] == "Debian"

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_facts['os_family'] == "Debian"

    - name: Reboot server if required
      ansible.builtin.reboot:
        msg: Reboot initiated by Ansible after package updates
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when:
        - ansible_facts['os_family'] == "Debian"
        - reboot_required_file.stat.exists | default(false)

    - name: Display update status
      ansible.builtin.debug:
        msg:
          - "APT cache updated: {{ apt_update is changed }}"
          - "Packages upgraded: {{ apt_upgrade is changed }}"
          - "Reboot required: {{ reboot_required_file.stat.exists | default(false) }}"
